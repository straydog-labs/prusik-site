name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
    steps:
      - name: Enable Pages from main/root with custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages already exists"
            cat /tmp/pages.json
          else
            echo "Creating Pages site from main / root"
            cat /tmp/pages.err || true
            gh api --method POST "repos/${REPO}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=legacy \
              -f source[branch]=main \
              -f source[path]=/
          fi
          echo "Setting custom domain straydogguiding.com"
          gh api --method PUT "repos/${REPO}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f cname=straydogguiding.com \
            -f source[branch]=main \
            -f source[path]=/
          echo "Final Pages configuration:"
          gh api "repos/${REPO}/pages"
